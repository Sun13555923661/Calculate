<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<!-- 移动端视口适配，必须加 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面积扣减计算</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{padding:12px;max-width:950px;margin:0 auto}

/* 标题 + 记账日期同一行、同一高度 */
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:10px;
}
.header-row h2{
  margin:0;
  font-size:clamp(1.5rem,4vw,2rem);
}
.date-item{
  font-size:16px;
  display:flex;
  align-items:center;
  gap:6px;
}
.date-label{
  white-space: nowrap;
}
.date-item input[type="date"]{
  padding:4px 6px;
  font-size:16px;
  width:220px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling: touch;
  margin:10px 0;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:640px;
}
col:nth-child(1){width:8%;}    /* 序号 */
col:nth-child(2){width:20%;}   /* 长 */
col:nth-child(3){width:20%;}   /* 高 */
col:nth-child(4){width:18%;}   /* 扣减长 */
col:nth-child(5){width:18%;}   /* 扣减高 */
col:nth-child(6){width:16%;}   /* 本行结果 */
th,td{border:1px solid #ccc;padding:6px 4px;text-align:center;font-size:14px}
input{
  width:100%;
  padding:6px;
  border:1px solid #aaa;
  background-color:#d8f3dc !important;
  -webkit-appearance:none;
}
.total{font-size:22px;font-weight:bold;color:#c00;margin:15px 0;}
.button-group{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0;
}
button{
  min-width:120px;
  padding:10px 14px;
  cursor:pointer;
  border:none;
  border-radius:4px;
  background:#409eff;
  color:#fff;
  font-size:15px;
  flex:1;
}

/* ==========手机端媒体查询========== */
@media (max-width: 640px) {
  body{padding:8px;}
  .header-row h2{font-size:1.4rem;}
  .date-item{width:100%;}
  .date-item input[type="date"]{width:100%;}
  table{min-width:100%;}
  th,td{font-size:12px;padding:4px 2px;}
  button{min-width:45%;font-size:14px;padding:8px 6px;}
  .total{font-size:18px;}
}
</style>
</head>
<body>
<div class="header-row">
  <h2>面积扣减计算</h2>
  <div class="date-item">
    <span class="date-label">记账日期：</span>
    <input type="date" id="recordDate">
  </div>
</div>

<div class="table-wrap">
<table>
  <colgroup>
    <col><col><col><col><col><col>
  </colgroup>
  <thead>
    <tr>
      <th>序号</th><th>长</th><th>高</th><th>扣减长</th><th>扣减高</th><th>本行结果</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <tr>
      <td class="idx">1</td>
      <td><input class="c"></td>
      <td><input class="e"></td>
      <td><input class="g"></td>
      <td><input class="h"></td>
      <td class="rowRes"></td>
    </tr>
  </tbody>
</table>
</div>

<div class="button-group">
<button onclick="addRow()">+新增一行</button>
<button onclick="addFiveRow()">+新增五行</button>
<button onclick="exportCsv()">导出CSV文件</button>
<button onclick="exportImage()">生成图片</button>
</div>

<div class="total">合计总数：<span id="sumTotal">0</span></div>

<script>
const tb = document.getElementById('tableBody');
const sumDom = document.getElementById('sumTotal');
const recordDateInput = document.getElementById("recordDate");

function setDefaultDate(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  recordDateInput.value = `${y}-${m}-${d}`;
}
setDefaultDate();

// 刷新所有行序号
function refreshIndex(){
  tb.querySelectorAll("tr").forEach((tr,idx)=>{
    tr.querySelector(".idx").innerText = idx+1;
  });
}

// 最多保留5位小数
function calcRow(row){
  const c = Number(row.querySelector('.c').value)||0; //长
  const e = Number(row.querySelector('.e').value)||0; //高
  const g = Number(row.querySelector('.g').value)||0; //扣减长
  const h = Number(row.querySelector('.h').value)||0; //扣减高
  let res = c*e;
  if(g>0 && h>0){
    res = res - g*h;
  }
  res = Math.round(res * 100000) / 100000;
  row.querySelector('.rowRes').innerText = res;
  return res;
}

function recalcAll(){
  let total = 0;
  document.querySelectorAll('#tableBody tr').forEach(tr=>{
    const cVal = tr.querySelector('.c').value;
    const eVal = tr.querySelector('.e').value;
    if(cVal.trim() === '' && eVal.trim() === ''){
      return;
    }
    total += calcRow(tr);
  })
  total = Math.round(total * 100000) / 100000;
  sumDom.innerText = total;
}

function addRow(){
  const tr = document.createElement('tr');
  tr.innerHTML = `
      <td class="idx"></td>
      <td><input class="c"></td>
      <td><input class="e"></td>
      <td><input class="g"></td>
      <td><input class="h"></td>
      <td class="rowRes"></td>
  `;
  tb.appendChild(tr);
  tr.querySelectorAll('input').forEach(i=>i.oninput=recalcAll);
  refreshIndex();
  recalcAll();
}

function addFiveRow(){
  for(let i=0;i<5;i++){
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="idx"></td>
        <td><input class="c"></td>
        <td><input class="e"></td>
        <td><input class="g"></td>
        <td><input class="h"></td>
        <td class="rowRes"></td>
    `;
    tb.appendChild(tr);
    tr.querySelectorAll('input').forEach(i=>i.oninput=recalcAll);
  }
  refreshIndex();
  recalcAll();
}

function exportCsv(){
  const recordDate = recordDateInput.value || "";
  const header = ["序号","记账日期","长","高","扣减长","扣减高","本行结果"];
  const rows = [header];
  document.querySelectorAll("#tableBody tr").forEach(tr=>{
    const idx = tr.querySelector('.idx').innerText || "";
    const c = tr.querySelector('.c').value || "";
    const e = tr.querySelector('.e').value || "";
    const g = tr.querySelector('.g').value || "";
    const h = tr.querySelector('.h').value || "";
    const res = tr.querySelector('.rowRes').innerText || "0";
    if(c.trim() === '' && e.trim() === '') return;
    rows.push([idx,recordDate,c,e,g,h,res]);
  });
  const csvText = rows.map(r=> r.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csvText],{type:"text/csv;charset=utf‑8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "面积扣减计算数据.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportImage(){
  html2canvas(document.body,{scale:2}).then(canvas=>{
    const link = document.createElement('a');
    link.download = "面积扣减计算截图.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  })
}

document.querySelectorAll('input').forEach(i=>i.oninput=recalcAll);
refreshIndex();
recalcAll();
</script>
</body>
</html>
